[project]
name = "id-dedup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
packages = [
    { include = "id_dedup", from = "src" },
]

dependencies = [
    "django~=5.2",
    "insightface>=1.0.1",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "bumpversion>=0.6.0",
    "django-stubs<6",
    "django-stubs-ext<6",
    "pytest>=9.1.0",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::FutureWarning:insightface"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
