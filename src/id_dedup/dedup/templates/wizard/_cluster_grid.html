{% for label, members in groups %}
<div class="cluster-card bg-gray-900 border border-gray-800 rounded-xl p-3 fade-in"
     data-cluster="{{ label }}"
     data-count="{{ members|length }}">
  <div class="cluster-imgs grid grid-cols-2 gap-1 mb-2"
       data-cluster="{{ label }}">
    {% for member in members %}
    <div class="bg-gray-800 rounded-lg aspect-square overflow-hidden"
         data-file="{{ member.file.name }}"
         draggable="true">
      <img src="{% url 'wizard:review_image' path=member.file.name %}"
           alt="{{ member.file.stem }}"
           class="w-full h-full object-cover"
           loading="lazy" />
    </div>
    {% endfor %}
  </div>
  <div class="flex items-center justify-between">
    <div>
      <span class="text-sm font-medium">Cluster {{ label }}</span>
      <span class="text-xs text-gray-500 ml-1.5 cluster-count">{{ members|length }} image{{ members|length|pluralize }}</span>
    </div>
    <button @click="openSplit('{{ label }}')"
            class="text-xs text-gray-400 border border-gray-700 rounded-md px-2 py-1 hover:bg-gray-800 hover:text-gray-200 transition-colors">
      Split
    </button>
  </div>
</div>
{% empty %}
<div class="col-span-full text-center py-16 text-gray-500">
  No clusters to display.
</div>
{% endfor %}

{% for member in singletons %}
<div class="cluster-card bg-gray-900 border border-gray-800 rounded-xl p-3 fade-in"
     data-cluster="-1"
     data-count="1">
  <div class="cluster-imgs mb-2 max-w-[50%]"
       data-cluster="-1">
    <div class="bg-gray-800 rounded-lg aspect-square overflow-hidden"
         data-file="{{ member.file.name }}">
      <img src="{% url 'wizard:review_image' path=member.file.name %}"
           alt="{{ member.file.stem }}"
           class="w-full h-full object-cover"
           loading="lazy" />
    </div>
  </div>
  <div class="flex items-center justify-between">
    <div>
      <span class="text-sm font-medium">Singleton</span>
      <span class="text-xs text-gray-500 ml-1.5">1 image</span>
    </div>
  </div>
</div>
{% endfor %}
