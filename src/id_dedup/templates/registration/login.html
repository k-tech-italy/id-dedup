{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>id-dedup — Login</title>
  <script src="{% static 'js/bundle.js' %}"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen antialiased flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <svg class="w-10 h-10 text-sky-400 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342" />
      </svg>
      <h1 class="text-2xl font-semibold tracking-tight">id-dedup</h1>
      <p class="text-sm text-gray-500 mt-1">Sign in to your account</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      {% if form.errors %}
      <div class="rounded-lg bg-red-950/50 border border-red-800 px-4 py-3 text-sm text-red-300">
        Invalid username or password.
      </div>
      {% endif %}

      <div>
        <label for="id_username" class="block text-sm font-medium text-gray-400 mb-1.5">Username</label>
        <input
          type="text"
          name="username"
          id="id_username"
          autocomplete="username"
          autofocus
          required
          class="w-full rounded-lg bg-gray-900 border border-gray-700 px-3 py-2.5 text-sm text-gray-100 placeholder-gray-500 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"
        />
      </div>

      <div>
        <label for="id_password" class="block text-sm font-medium text-gray-400 mb-1.5">Password</label>
        <input
          type="password"
          name="password"
          id="id_password"
          autocomplete="current-password"
          required
          class="w-full rounded-lg bg-gray-900 border border-gray-700 px-3 py-2.5 text-sm text-gray-100 placeholder-gray-500 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"
        />
      </div>

      {% if next %}
      <input type="hidden" name="next" value="{{ next }}" />
      {% endif %}

      <button
        type="submit"
        class="w-full rounded-lg bg-sky-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 focus:ring-offset-gray-950 transition-colors"
      >
        Sign in
      </button>
    </form>
  </div>

</body>
</html>
