{% extends "base.html" %}
{% load static %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-12">
  <div class="pb-12">
    <h1 class="text-2xl font-semibold tracking-tight">Welcome, {{ user.username }}</h1>
    <p class="text-gray-500 mt-1">Face image deduplication and identity management</p>
  </div>

  <div class="grid gap-6 sm:grid-cols-2">
    <!-- New Upload -->
    <a href="{% url 'wizard:upload' %}"
       class="group rounded-xl border border-gray-800 bg-gray-900/50 p-6 hover:border-sky-600/50 hover:bg-gray-900 transition-all">
      <div class="flex items-center gap-4">
        <div class="flex items-center justify-center w-12 h-12 rounded-lg bg-sky-600/10 text-sky-400 group-hover:bg-sky-600/20 transition-colors">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-medium text-gray-200 group-hover:text-white transition-colors">New Upload</h2>
          <p class="text-sm text-gray-500 mt-0.5">Upload images and start processing</p>
        </div>
      </div>
    </a>

    <!-- Tickets placeholder -->
    <div class="rounded-xl border border-gray-800 bg-gray-900/50 p-6 opacity-60">
      <div class="flex items-center gap-4">
        <div class="flex items-center justify-center w-12 h-12 rounded-lg bg-gray-800 text-gray-600">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-medium text-gray-500">Tickets</h2>
          <p class="text-sm text-gray-600 mt-0.5">Batch and ticket status coming soon</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
