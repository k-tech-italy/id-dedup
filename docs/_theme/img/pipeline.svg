<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img"
     aria-label="Five-stage pipeline: detect, embed, cluster, match, decide">
  <defs>
    <marker id="pArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#94A3B8"/>
    </marker>
    <style>
      .stage  { stroke-width: 2; rx: 16; }
      .num    { font: 700 12px system-ui, sans-serif; fill: #fff; }
      .title  { font: 700 15px system-ui, sans-serif; }
      .sub    { font: 12.5px system-ui, sans-serif; fill: #94A3B8; }
      .track  { stroke: #94A3B8; stroke-width: 2; opacity: .55; }
    </style>
  </defs>

  <line class="track" x1="160" y1="72" x2="192" y2="72" marker-end="url(#pArrow)"/>
  <line class="track" x1="320" y1="72" x2="352" y2="72" marker-end="url(#pArrow)"/>
  <line class="track" x1="480" y1="72" x2="512" y2="72" marker-end="url(#pArrow)"/>
  <line class="track" x1="640" y1="72" x2="672" y2="72" marker-end="url(#pArrow)"/>

  <!-- 1 Detect -->
  <g transform="translate(16 24)">
    <rect class="stage" width="144" height="96" stroke="#818CF8" fill="#6366F1" fill-opacity=".08"/>
    <circle cx="24" cy="24" r="12" fill="#6366F1"/><text class="num" x="24" y="28.5" text-anchor="middle">1</text>
    <text class="title" x="24" y="58" fill="#818CF8">Detect</text>
    <text class="sub" x="24" y="78">largest face</text>
  </g>
  <!-- 2 Embed -->
  <g transform="translate(176 24)">
    <rect class="stage" width="144" height="96" stroke="#818CF8" fill="#6366F1" fill-opacity=".08"/>
    <circle cx="24" cy="24" r="12" fill="#6366F1"/><text class="num" x="24" y="28.5" text-anchor="middle">2</text>
    <text class="title" x="24" y="58" fill="#818CF8">Embed</text>
    <text class="sub" x="24" y="78">512-d ArcFace</text>
  </g>
  <!-- 3 Cluster -->
  <g transform="translate(336 24)">
    <rect class="stage" width="144" height="96" stroke="#818CF8" fill="#6366F1" fill-opacity=".08"/>
    <circle cx="24" cy="24" r="12" fill="#6366F1"/><text class="num" x="24" y="28.5" text-anchor="middle">3</text>
    <text class="title" x="24" y="58" fill="#818CF8">Cluster</text>
    <text class="sub" x="24" y="78">DBSCAN, cosine</text>
  </g>
  <!-- 4 Match -->
  <g transform="translate(496 24)">
    <rect class="stage" width="144" height="96" stroke="#2DD4BF" fill="#14B8A6" fill-opacity=".08"/>
    <circle cx="24" cy="24" r="12" fill="#14B8A6"/><text class="num" x="24" y="28.5" text-anchor="middle">4</text>
    <text class="title" x="24" y="58" fill="#2DD4BF">Match</text>
    <text class="sub" x="24" y="78">pgvector search</text>
  </g>
  <!-- 5 Decide -->
  <g transform="translate(656 24)">
    <rect class="stage" width="228" height="96" stroke="#FBBF24" fill="#F59E0B" fill-opacity=".10"
          stroke-dasharray="0"/>
    <circle cx="24" cy="24" r="12" fill="#F59E0B"/><text class="num" x="24" y="28.5" text-anchor="middle">5</text>
    <text class="title" x="24" y="58" fill="#FBBF24">Decide</text>
    <text class="sub" x="24" y="78">a person confirms it</text>
    <g transform="translate(176 30)">
      <circle r="20" fill="#F59E0B" fill-opacity=".18"/>
      <circle cy="-5" r="6.5" fill="#FBBF24"/>
      <path d="M-11 13a11 11 0 0 1 22 0Z" fill="#FBBF24"/>
    </g>
  </g>

  <!-- The boundary that matters. -->
  <path d="M648 8v128" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 5" opacity=".7"/>
  <text x="332" y="164" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="12.5" font-weight="600" fill="#94A3B8">automatic</text>
  <text x="770" y="164" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="12.5" font-weight="700" fill="#F59E0B">never automatic</text>
  <line class="track" x1="16" y1="176" x2="648" y2="176"/>
  <line x1="656" y1="176" x2="884" y2="176" stroke="#F59E0B" stroke-width="2.5"/>
</svg>
