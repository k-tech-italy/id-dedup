<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img"
     aria-label="A business write and its outbox row commit together, then a sweep publishes to the broker">
  <defs>
    <marker id="oArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#94A3B8"/>
    </marker>
    <style>
      .lbl { font: 700 13px system-ui, sans-serif; }
      .sub { font: 12px system-ui, sans-serif; fill: #94A3B8; }
      .chip{ font: 700 11px system-ui, sans-serif; fill: #fff; }
    </style>
  </defs>

  <rect x="14" y="30" width="250" height="110" rx="14" fill="#6366F1" fill-opacity=".10"
        stroke="#818CF8" stroke-width="2"/>
  <text class="lbl" x="34" y="24" fill="#818CF8">one transaction</text>
  <rect x="36" y="52" width="206" height="32" rx="8" fill="#6366F1"/>
  <text class="chip" x="139" y="72" text-anchor="middle">business write</text>
  <rect x="36" y="94" width="206" height="32" rx="8" fill="#6366F1" fill-opacity=".65"/>
  <text class="chip" x="139" y="114" text-anchor="middle">outbox row</text>
  <text class="sub" x="139" y="160" text-anchor="middle">both, or neither</text>

  <line x1="278" y1="85" x2="330" y2="85" stroke="#94A3B8" stroke-width="2.5"
        marker-end="url(#oArrow)" opacity=".7"/>

  <rect x="346" y="46" width="164" height="78" rx="14" fill="#14B8A6" fill-opacity=".10"
        stroke="#2DD4BF" stroke-width="2"/>
  <text class="lbl" x="428" y="80" text-anchor="middle" fill="#2DD4BF">sweep</text>
  <text class="sub" x="428" y="100" text-anchor="middle">claims, then sends</text>
  <text class="sub" x="428" y="160" text-anchor="middle">skip-locked, one row at a time</text>

  <line x1="524" y1="85" x2="576" y2="85" stroke="#94A3B8" stroke-width="2.5"
        marker-end="url(#oArrow)" opacity=".7"/>

  <rect x="592" y="46" width="154" height="78" rx="14" fill="#F59E0B" fill-opacity=".12"
        stroke="#FBBF24" stroke-width="2"/>
  <text class="lbl" x="669" y="80" text-anchor="middle" fill="#FBBF24">broker</text>
  <text class="sub" x="669" y="100" text-anchor="middle">Celery task runs</text>
  <text class="sub" x="669" y="160" text-anchor="middle">at-least-once</text>
</svg>
