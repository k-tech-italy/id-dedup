<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img"
     aria-label="The four wizard steps: upload, review, adjudication, complete">
  <defs>
    <marker id="wA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#94A3B8"/>
    </marker>
    <style>
      .n  { font: 700 13px system-ui, sans-serif; fill: #fff; }
      .t  { font: 700 15px system-ui, sans-serif; }
      .d  { font: 12.5px system-ui, sans-serif; fill: #94A3B8; }
      .b  { stroke-width: 2; rx: 14; }
      .tr { stroke: #94A3B8; stroke-width: 2; opacity: .6; }
    </style>
  </defs>

  <line class="tr" x1="196" y1="76" x2="222" y2="76" marker-end="url(#wA)"/>
  <line class="tr" x1="398" y1="76" x2="424" y2="76" marker-end="url(#wA)"/>
  <line class="tr" x1="600" y1="76" x2="626" y2="76" marker-end="url(#wA)"/>

  <g transform="translate(12 20)">
    <rect class="b" width="180" height="112" fill="#6366F1" fill-opacity=".08" stroke="#818CF8"/>
    <circle cx="26" cy="26" r="13" fill="#6366F1"/><text class="n" x="26" y="30.5" text-anchor="middle">1</text>
    <text class="t" x="26" y="62" fill="#818CF8">Upload</text>
    <text class="d" x="26" y="82">drop the batch in</text>
    <text class="d" x="26" y="99">faces are extracted</text>
  </g>
  <g transform="translate(214 20)">
    <rect class="b" width="180" height="112" fill="#6366F1" fill-opacity=".08" stroke="#818CF8"/>
    <circle cx="26" cy="26" r="13" fill="#6366F1"/><text class="n" x="26" y="30.5" text-anchor="middle">2</text>
    <text class="t" x="26" y="62" fill="#818CF8">Review</text>
    <text class="d" x="26" y="82">fix the grouping</text>
    <text class="d" x="26" y="99">drag, split, merge</text>
  </g>
  <g transform="translate(416 20)">
    <rect class="b" width="180" height="112" fill="#F59E0B" fill-opacity=".10" stroke="#FBBF24"/>
    <circle cx="26" cy="26" r="13" fill="#F59E0B"/><text class="n" x="26" y="30.5" text-anchor="middle">3</text>
    <text class="t" x="26" y="62" fill="#FBBF24">Adjudication</text>
    <text class="d" x="26" y="82">accept, search,</text>
    <text class="d" x="26" y="99">or create an identity</text>
  </g>
  <g transform="translate(618 20)">
    <rect class="b" width="180" height="112" fill="#14B8A6" fill-opacity=".10" stroke="#2DD4BF"/>
    <circle cx="26" cy="26" r="13" fill="#14B8A6"/><text class="n" x="26" y="30.5" text-anchor="middle">4</text>
    <text class="t" x="26" y="62" fill="#2DD4BF">Complete</text>
    <text class="d" x="26" y="82">read-only summary</text>
    <text class="d" x="26" y="99">session is cleared</text>
  </g>

  <!-- Where the database is actually touched. -->
  <path d="M506 140v22h-2" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <rect x="356" y="164" width="300" height="26" rx="13" fill="#F59E0B"/>
  <text x="506" y="182" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="12" font-weight="700" fill="#fff">the database is written here, in one transaction</text>
  <text x="670" y="182" font-family="system-ui,sans-serif" font-size="12" fill="#94A3B8">— not at step 4</text>
</svg>
